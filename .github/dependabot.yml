# Dependabot version updates (Phase 5). Updates arrive as pull requests that run
# CI; nothing merges without the maintainer. Keep open PRs few and grouped.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      actions:
        update-types: [minor, patch]
    labels: [dependencies]
